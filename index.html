<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UP China — Assessoria para importação da China</title>
<meta name="description" content="A UP China cuida de cada etapa da sua importação: encontra o fornecedor, visita a fábrica, organiza o embarque, o desembaraço e entrega na sua empresa.">
<meta property="og:title" content="UP China — Da fábrica na China até a sua empresa">
<meta property="og:description" content="Assessoria completa para importação da China e imersões com empresários.">
<meta property="og:image" content="logo.png">
<meta name="theme-color" content="#0C0B0B">
<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0C0B0B}
a{color:#F3F1EC}a:hover{color:#F2B33D}
.cloud{position:absolute;border-radius:50%;background:#FFFFFF;filter:blur(30px)}
input:focus{outline:2px solid #F2B33D;outline-offset:2px}
</style>

<style>
@media (max-width: 900px){
 header nav{display:none!important}
 header a{white-space:nowrap!important}
 header a span{font-size:18px!important}
 header > div > a:last-child{font-size:11px!important;padding:0 12px!important;height:38px!important}
 header img{width:30px!important;height:30px!important}
 .sctext{left:18px!important;right:18px!important;top:56px!important;max-width:none!important}
 .sctext h1{font-size:46px!important}
 .sctext h2{font-size:38px!important;min-height:2.6em!important}
 .sctext p{font-size:14px!important;margin-top:10px!important}
 .sctext ul{margin-top:12px!important;gap:6px!important}
 .sctext li{font-size:13px!important}
 .v-radar{width:118vw!important;right:-30%!important;top:72%!important}
 .v-fact{width:min(104vw,560px)!important;right:-6%!important;bottom:5%!important}
 .v-stack{width:118vw!important;right:-12%!important;bottom:10%!important}
 .v-ship{left:74%!important;width:30vw!important}
 .v-docs{width:88vw!important;right:6%!important;top:72%!important;height:40%!important}
 .v-docs > div:not(.v-stamp){width:50%!important;padding:12px!important}
 .v-docs > div:not(.v-stamp) div{font-size:14px!important}
 .v-stamp{left:16%!important;top:40%!important;font-size:30px!important;border-width:4px!important;padding:6px 12px!important}
 .v-plane{left:50%!important;width:76vw!important;margin-top:130px!important}
 .v-route{bottom:64px!important}
 .v-emb{width:190vw!important;left:-45vw!important;right:auto!important;height:46%!important;bottom:8%!important}
 .v-roadmap{transform:translate(470px,470px) scale(0.36)!important}
 .pbar{grid-template-columns:repeat(7,minmax(0,1fr))!important;gap:4px!important}
 .pbar li{font-size:0!important;padding-top:0!important}
 .imm{height:auto!important}
 .imm-wrap{flex-direction:column!important;padding:36px 18px 40px!important;gap:22px!important}
 .imm-left{display:contents!important}
 .imm-right{order:2!important}
 .imm-cards{order:3!important}
 .imm-cards li{padding:12px!important;min-height:0!important}
 .imm-cards li span:nth-child(2){font-size:17px!important;overflow-wrap:anywhere}
 .imm h2{font-size:52px!important;min-height:0!important}
 .imm-right svg text{font-size:20px!important}
 .imm-right > svg{margin:10px 0 14px!important}
 .imm-stick{position:relative!important;top:0!important;height:auto!important;min-height:0!important}
 #contato h2{font-size:46px!important}
 #etapas h2{font-size:38px!important;overflow-wrap:anywhere}
 .imm-wrap{transform:none!important;height:auto!important}
}
@media (max-width: 520px){ .imm-right svg text{font-size:30px!important} .v-fact{width:90vw!important;right:-2%!important;bottom:3%!important} }
</style>
</head>

      <nav aria-label="Principal" style="display: flex; gap: 26px; flex-wrap: wrap; font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em">

      <a href="https://beacons.ai/upchina" style="background: #B5121B; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 18px; height: 42px; display: flex; align-items: center">Quero importar</a>
    </div>
  </header>

  <!-- HISTÓRIA -->
  <section id="processo" ref="{{setSec}}" style="position: relative; height: 16500px">
    <div id="topo" ref="{{setStick}}" style="position: sticky; top: 61px; height: min(calc(100vh - 61px), 900px); min-height: 580px; overflow: hidden; background: #0C0B0B">

      <!-- ===== 01 FORNECEDOR: radar ===== -->
      <div style="position: absolute; inset: 0; opacity: {{c1}}; background: #0C0B0B">
        <div class="v-radar" style="position: absolute; right: -4%; top: 52%; width: min(64vw, 860px); aspect-ratio: 1 / 1; transform: translateY(-50%) perspective(1500px) rotateX(56deg) rotateZ(-18deg)">
          <svg viewBox="0 0 1000 1000" role="img" aria-label="Radar de busca de fornecedores na China" style="width: 100%; height: 100%; display: block; overflow: visible">
            <circle cx="500" cy="500" r="470" fill="#141212" stroke="#3A2A2A" stroke-width="2"></circle>
            <circle cx="500" cy="500" r="350" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"></circle>
            <circle cx="500" cy="500" r="230" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"></circle>
